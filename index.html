<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Inventario</title>

<!-- Instalable en iOS -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Inventario" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A6CFF" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
:root {
  --ink: #1D1D1F;
  --ink-dim: #6E6E73;
  --hairline: rgba(0,0,0,0.08);
  --glass: rgba(255,255,255,0.55);
  --glass-border: rgba(255,255,255,0.65);
  --blue: #0A84FF;
  --blue-deep: #0060DF;
  --red: #FF3B30;
  --orange: #FF9500;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; background: #EEF1F6; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink); overscroll-behavior-y: none; }
button, input { font-family: inherit; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.ivt-root { position: relative; min-height: 100vh; overflow-x: hidden; }
.ivt-hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ivt-mesh {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(at 15% 12%, rgba(120,180,255,0.55) 0px, transparent 55%),
    radial-gradient(at 88% 8%, rgba(210,160,255,0.45) 0px, transparent 55%),
    radial-gradient(at 8% 92%, rgba(255,175,205,0.4) 0px, transparent 55%),
    radial-gradient(at 92% 95%, rgba(140,235,210,0.45) 0px, transparent 55%),
    #EEF1F6;
}
.ivt-shell { max-width: 600px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)) 16px; }

.ivt-header { background: var(--glass); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px 22px 18px; margin-bottom: 18px; box-shadow: 0 8px 30px rgba(31,38,135,0.08); }
.ivt-header-top { margin-bottom: 14px; }
.ivt-greeting { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-dim); }
.ivt-title { font-size: 29px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 0; }
.ivt-subtitle { margin: 3px 0 0; color: var(--ink-dim); font-size: 12px; text-transform: capitalize; }
.ivt-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.ivt-stat { display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,0.6); border: 1px solid var(--hairline); }
.ivt-stat-icon { font-size: 13px; }
.ivt-stat-warn { background: rgba(255,59,48,0.12); border-color: rgba(255,59,48,0.25); }
.ivt-stat-num { font-size: 14px; font-weight: 700; line-height: 1; }
.ivt-stat-warn .ivt-stat-num { color: var(--red); }
.ivt-stat-label { font-size: 10px; color: var(--ink-dim); }
.ivt-stat-warn .ivt-stat-label { color: var(--red); }

.ivt-loading { padding: 6px 0; }
.ivt-skeleton-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.ivt-skeleton-card { height: 118px; border-radius: 20px; background: linear-gradient(100deg, rgba(255,255,255,0.35) 30%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.35) 70%); background-size: 200% 100%; border: 1px solid var(--glass-border); animation: ivtShimmer 1.4s ease-in-out infinite; }
@keyframes ivtShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.ivt-view-fade { animation: ivtFadeIn 0.3s cubic-bezier(.22,.8,.25,1); }
@keyframes ivtFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.ivt-navbar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.ivt-back-btn { display: inline-flex; align-items: center; gap: 2px; background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 999px; padding: 9px 18px 9px 13px; color: var(--blue); font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(31,38,135,0.06); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ivt-back-btn:active { transform: scale(0.96); }
.ivt-back-chevron { font-size: 19px; font-weight: 700; line-height: 0; position: relative; top: 1px; }
.ivt-home-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); color: var(--ink); font-size: 15px; cursor: pointer; box-shadow: 0 4px 14px rgba(31,38,135,0.06); flex-shrink: 0; }

.ivt-quick-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.ivt-quick-btn { flex: 1; min-width: 140px; display: flex; align-items: center; gap: 9px; justify-content: center; background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 16px; padding: 14px; cursor: pointer; color: var(--ink); font-weight: 700; font-size: 13px; box-shadow: 0 8px 20px rgba(31,38,135,0.06); }
.ivt-quick-icon { font-size: 18px; }

.ivt-home-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.ivt-case { position: relative; background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); box-shadow: 0 8px 20px rgba(31,38,135,0.06); }
.ivt-case:active { transform: scale(0.97); }
.ivt-case-badge { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 25px; box-shadow: 0 6px 16px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.5); }
.ivt-case-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
.ivt-case-meta { font-size: 10px; color: var(--ink-dim); text-align: center; }
.ivt-case-del { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.85); border: 1px solid var(--hairline); color: var(--ink-dim); width: 22px; height: 22px; border-radius: 50%; font-size: 9px; cursor: pointer; opacity: 0.6; }
.ivt-case-del:active { color: var(--red); border-color: var(--red); }
.ivt-photo-btn { position: absolute; bottom: 8px; left: 8px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.85); background-size: cover; background-position: center; border: 1px solid var(--hairline); color: var(--ink-dim); font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.75; }
.ivt-row-photo-btn { width: 21px; height: 21px; border-radius: 50%; background: rgba(255,255,255,0.85); background-size: cover; background-position: center; border: 1px solid var(--hairline); color: var(--ink-dim); font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: 0.75; }
.ivt-dot { position: absolute; top: 10px; left: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(255,59,48,0.2); }
.ivt-dot-inline { position: static; margin: 0 2px; box-shadow: none; }
.ivt-case-add { border: 2px dashed rgba(0,0,0,0.15); background: rgba(255,255,255,0.25); justify-content: center; color: var(--ink-dim); box-shadow: none; }
.ivt-add-plus { font-size: 26px; line-height: 1; font-weight: 300; }
.ivt-case-add-label { font-size: 12px; font-weight: 600; margin-top: 3px; text-align: center; }

.ivt-search-view { display: flex; flex-direction: column; gap: 14px; }
.ivt-search-big { background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 999px; padding: 14px 20px; font-size: 15px; color: var(--ink); box-shadow: 0 8px 24px rgba(31,38,135,0.06); }
.ivt-search-big:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(10,132,255,0.15); }
.ivt-search-hint { color: var(--ink-dim); font-size: 13px; text-align: center; padding: 18px 6px; }
.ivt-search-result-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.ivt-search-path { font-size: 10.5px; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ivt-map-view { display: flex; flex-direction: column; gap: 12px; }
.ivt-map-hint { color: var(--ink-dim); font-size: 12.5px; margin: 0; }
.ivt-map-canvas { position: relative; width: 100%; aspect-ratio: 4 / 3; background: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px) 0 0 / 32px 32px, linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px) 0 0 / 32px 32px, rgba(255,255,255,0.4); border: 1px solid var(--glass-border); border-radius: 22px; overflow: hidden; touch-action: none; }
.ivt-map-room { position: absolute; transform: translate(-50%, -50%); width: 84px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 8px; border-radius: 16px; color: #fff; cursor: grab; box-shadow: 0 8px 20px rgba(0,0,0,0.2); user-select: none; touch-action: none; }
.ivt-map-room-dragging { cursor: grabbing; box-shadow: 0 14px 30px rgba(0,0,0,0.3); z-index: 5; }
.ivt-map-room-emoji { font-size: 21px; }
.ivt-map-room-name { font-size: 10px; font-weight: 700; text-align: center; }
.ivt-map-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-dim); font-size: 12px; text-align: center; padding: 16px; }

.ivt-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.ivt-view-title { display: flex; align-items: center; gap: 11px; }
.ivt-view-title h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
.ivt-view-badge { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); color: #fff; flex-shrink: 0; }
.ivt-view-badge-neutral { background: rgba(255,255,255,0.7); box-shadow: none; border: 1px solid var(--hairline); }
.ivt-toolbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.ivt-section-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); margin: 0 0 9px 3px; }
.ivt-section-title-spaced { margin-top: 24px; }
.ivt-empty-hint { background: rgba(255,255,255,0.4); border: 1px dashed rgba(0,0,0,0.15); border-radius: 16px; padding: 16px 18px; color: var(--ink-dim); font-size: 12.5px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

.ivt-list { display: flex; flex-direction: column; gap: 9px; }
.ivt-row { position: relative; display: flex; align-items: center; gap: 10px; background: var(--glass); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 15px; padding: 13px 15px; cursor: pointer; color: var(--ink); text-align: left; box-shadow: 0 4px 14px rgba(31,38,135,0.05); }
.ivt-row:active { transform: scale(0.98); }
.ivt-row-badge { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.7); border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.ivt-row-name { font-weight: 600; font-size: 13.5px; flex: 1; }
.ivt-row-count { font-size: 11px; color: var(--ink-dim); background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.ivt-row-chevron { color: rgba(0,0,0,0.25); font-size: 15px; }
.ivt-row-del { background: rgba(255,255,255,0.85); border: 1px solid var(--hairline); color: var(--ink-dim); width: 20px; height: 20px; border-radius: 50%; font-size: 9px; cursor: pointer; opacity: 0.6; }
.ivt-row-del:active { color: var(--red); border-color: var(--red); }

.ivt-search { background: rgba(255,255,255,0.6); border: 1px solid var(--hairline); color: var(--ink); padding: 8px 13px; border-radius: 999px; font-size: 12px; flex: 1; min-width: 110px; backdrop-filter: blur(10px); }
.ivt-search::placeholder { color: var(--ink-dim); }
.ivt-search:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(10,132,255,0.15); }

.ivt-btn { font-weight: 600; font-size: 12.5px; padding: 9px 15px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; }
.ivt-btn:active { transform: scale(0.96); }
.ivt-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ivt-btn-primary { background: linear-gradient(135deg, #34A7FF, var(--blue-deep)); color: #fff; box-shadow: 0 4px 14px rgba(10,132,255,0.35); }
.ivt-btn-ghost { background: rgba(255,255,255,0.55); border-color: var(--hairline); color: var(--ink); backdrop-filter: blur(10px); }
.ivt-btn-danger { background: linear-gradient(135deg, #FF6259, var(--red)); color: #fff; box-shadow: 0 4px 14px rgba(255,59,48,0.35); }

.ivt-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.ivt-slot { position: relative; background: var(--glass); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 19px; padding: 15px 11px 11px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 142px; box-shadow: 0 6px 16px rgba(31,38,135,0.06); }
.ivt-slot-low { box-shadow: 0 0 0 2px rgba(255,149,0,0.35), 0 6px 16px rgba(31,38,135,0.06); }
.ivt-slot-del { position: absolute; top: 7px; right: 7px; background: rgba(255,255,255,0.85); border: 1px solid var(--hairline); color: var(--ink-dim); width: 21px; height: 21px; border-radius: 50%; font-size: 9px; cursor: pointer; opacity: 0.6; }
.ivt-slot-del:active { color: var(--red); border-color: var(--red); }
.ivt-slot-body { background: none; border: none; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; width: 100%; padding: 0; }
.ivt-slot-badge { width: 48px; height: 48px; border-radius: 15px; background: rgba(255,255,255,0.7); border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; font-size: 24px; }
.ivt-slot-name { font-size: 12.5px; font-weight: 600; text-align: center; }
.ivt-slot-note { font-size: 9.5px; color: var(--ink-dim); font-style: italic; text-align: center; }
.ivt-slot-lastused { font-size: 9px; color: var(--ink-dim); background: rgba(0,0,0,0.05); padding: 2px 7px; border-radius: 999px; }
.ivt-stepper { margin-top: auto; display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.6); border: 1px solid var(--hairline); border-radius: 999px; padding: 3px 4px; }
.ivt-stepper button { background: rgba(255,255,255,0.9); border: 1px solid var(--hairline); color: var(--ink); width: 21px; height: 21px; border-radius: 50%; cursor: pointer; font-size: 13px; line-height: 1; }
.ivt-stepper button:active { transform: scale(0.9); }
.ivt-qty { font-size: 11.5px; font-weight: 600; min-width: 40px; text-align: center; }
.ivt-qty em { font-style: normal; color: var(--ink-dim); font-weight: 400; font-size: 9.5px; }
.ivt-low-badge { position: absolute; bottom: -8px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.02em; background: linear-gradient(135deg, #FFB03C, var(--orange)); color: #fff; padding: 3px 9px; border-radius: 999px; box-shadow: 0 3px 8px rgba(255,149,0,0.4); }
.ivt-slot-add { background: rgba(255,255,255,0.25); border: 2px dashed rgba(0,0,0,0.15); color: var(--ink-dim); cursor: pointer; justify-content: center; box-shadow: none; font-size: 12.5px; }

.ivt-toast { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: rgba(255,59,48,0.92); backdrop-filter: blur(10px); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; box-shadow: 0 8px 24px rgba(255,59,48,0.4); z-index: 70; white-space: nowrap; }

.ivt-overlay { position: fixed; inset: 0; background: rgba(20,20,25,0.25); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.ivt-modal { background: rgba(255,255,255,0.9); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255,255,255,0.6); border-radius: 26px; padding: 24px; width: 100%; max-width: 380px; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
.ivt-modal h3 { font-size: 18px; font-weight: 800; margin: 0 0 15px; letter-spacing: -0.01em; }
.ivt-modal-hint { font-size: 11.5px; color: var(--ink-dim); margin: -6px 0 15px; line-height: 1.5; }
.ivt-confirm p { color: var(--ink-dim); font-size: 12.5px; line-height: 1.5; }
.ivt-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; font-size: 11.5px; color: var(--ink-dim); font-weight: 600; }
.ivt-field-row { display: flex; gap: 9px; }
.ivt-field-row .ivt-field { flex: 1; }
.ivt-field input { background: rgba(255,255,255,0.7); border: 1px solid var(--hairline); color: var(--ink); padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 400; width: 100%; }
.ivt-field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(10,132,255,0.15); }
.ivt-emoji-row { display: flex; align-items: center; gap: 8px; }
.ivt-emoji-preview { font-size: 25px; width: 42px; height: 42px; border-radius: 13px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; border: 1px solid var(--hairline); }
.ivt-emoji-input { width: 58px !important; text-align: center; }
.ivt-emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 8px; }
.ivt-emoji-btn { background: rgba(255,255,255,0.55); border: 1px solid var(--hairline); border-radius: 10px; font-size: 16px; padding: 6px 0; cursor: pointer; }
.ivt-color-row { display: flex; gap: 8px; }
.ivt-color-swatch { width: 29px; height: 29px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.ivt-color-active { border-color: var(--ink); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.ivt-modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 7px; }
.ivt-modal-actions-spread { justify-content: space-between; align-items: center; flex-wrap: wrap; }
.ivt-photo-full { width: 100%; max-height: 46vh; object-fit: cover; border-radius: 16px; display: block; margin: 4px 0 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }

button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* Efectos puramente decorativos: solo con puntero fino real, nunca en
   pantallas táctiles, para que un solo toque navegue siempre. */
@media (hover: hover) and (pointer: fine) {
  .ivt-case:hover { transform: translateY(-3px); }
  .ivt-row:hover { transform: translateX(2px); }
  .ivt-btn-primary:hover:not(:disabled) { box-shadow: 0 6px 18px rgba(10,132,255,0.45); }
  .ivt-btn-ghost:hover { background: rgba(255,255,255,0.8); }
  .ivt-case-del:hover, .ivt-row-del:hover, .ivt-slot-del:hover { color: var(--red); border-color: var(--red); }
}
</style>
</head>
<body>

<div class="ivt-root">
  <div class="ivt-mesh"></div>
  <input id="photoInput" type="file" accept="image/*" capture="environment" class="ivt-hidden-input" />
  <div class="ivt-shell">
    <header id="header" class="ivt-header"></header>
    <div id="navbar"></div>
    <div id="viewRoot"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "inventario-data-v2";

  var EMOJI_PALETTE = [
    "🏠","🚪","🛋️","🥛","🧀","🥩","🍗","🥚","🧈","🍞","🥫","🧂","🍚","🍝","🍎",
    "🧊","❄️","🥤","🍷","🧴","🧻","🧼","🪥","💊","🧦","👕","👖",
    "🧥","👟","🧢","🛠️","🔩","🪛","🔋","💡","🧯","📦","🎮","📚",
    "🧸","🐾","🚗","🥦","🍫","🧃","🍯","🩹","🔑","🧵","📎","🫒"
  ];

  var ACCENT_GRADIENTS = [
    "linear-gradient(135deg,#63B4FF,#0A6CFF)",
    "linear-gradient(135deg,#5EE7B0,#0A9B63)",
    "linear-gradient(135deg,#FFC168,#FF9500)",
    "linear-gradient(135deg,#FF8FA3,#FF3B30)",

  function fileToCompressedDataUrl(file) {
    return new Promise(function (resolve, reject) {

  // ---------------- selectores ----------------
  function getRoom(id) { return data.rooms.find(function (r) { return r.id === id; }); }
  function getContainer(id) { return data.containers.find(function (c) { return c.id === id; }); }
  function getDrawer(id) { return data.drawers.find(function (d) { return d.id === id; }); }
  function containersOf(roomId) { return data.containers.filter(function (c) { return c.roomId === roomId; }); }
  function drawersOf(containerId) { return data.drawers.filter(function (d) { return d.containerId === containerId; }); }
  function looseItemsOf(containerId) { return data.items.filter(function (it) { return it.containerId === containerId && !it.drawerId; }); }
  function itemsOfDrawer(drawerId) { return data.items.filter(function (it) { return it.drawerId === drawerId; }); }

    els.forEach(function (el) {
      el.addEventListener("pointerdown", function (e) {
        el.setPointerCapture && el.setPointerCapture(e.pointerId);
        draggingRoomId = el.getAttribute("data-room-id");
        dragMoved = false;
        el.classList.add("ivt-map-room-dragging");
      });
    });
    function handleMove(e) {
      if (!draggingRoomId) return;
      dragMoved = true;
      var rect = canvas.getBoundingClientRect();
      var x = clampNum(((e.clientX - rect.left) / rect.width) * 100, 8, 92);
      var y = clampNum(((e.clientY - rect.top) / rect.height) * 100, 10, 90);
      var r = getRoom(draggingRoomId);
      if (r) { r.x = x; r.y = y; }
      var el = canvas.querySelector('.ivt-map-room[data-room-id="' + draggingRoomId + '"]');
      if (el) { el.style.left = x + "%"; el.style.top = y + "%"; }
    }
    function handleUp() {
      if (!draggingRoomId) return;
      var wasTap = !dragMoved;
      var roomId = draggingRoomId;
      var el = canvas.querySelector('.ivt-map-room[data-room-id="' + roomId + '"]');
      if (el) el.classList.remove("ivt-map-room-dragging");
      draggingRoomId = null;
      if (wasTap) { openRoom(roomId); }
      else { save(); }
    }
    window.addEventListener("pointermove", handleMove);
    window.addEventListener("pointerup", handleUp);
  }

      '<button class="ivt-btn ivt-btn-ghost" data-action="remove-photo">Quitar foto</button>' +
      '<div style="display:flex;gap:9px;">' +
      '<button class="ivt-btn ivt-btn-ghost" data-action="replace-photo">Cambiar</button>' +
      '<button class="ivt-btn ivt-btn-primary" data-action="close-modal">Cerrar</button>' +
      '</div></div></div></div>';
  }
  function removeCurrentPhoto() {
    if (!viewingPhoto) return;
    if (viewingPhoto.type === "container") { var c = getContainer(viewingPhoto.id); if (c) c.photo = ""; }
    else { var d = getDrawer(viewingPhoto.id); if (d) d.photo = ""; }
    viewingPhoto = null; save(); closeModal(); renderAll();
  }
  async function handlePhotoSelected(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    var target = photoTarget; photoTarget = null;
    if (!file || !target) return;
    try {
      var dataUrl = await fileToCompressedDataUrl(file);
      if (target.type === "container") { var c = getContainer(target.id); if (c) c.photo = dataUrl; }
      else { var d = getDrawer(target.id); if (d) d.photo = dataUrl; }
      save(); renderAll();
    } catch (err) {
      toast("No se pudo usar esa imagen. Prueba con otra foto.");
    }
  }

  function toast(msg) {
    var el = document.getElementById("toastRoot");
    el.innerHTML = '<div class="ivt-toast">' + esc(msg) + '</div>';
    setTimeout(function () { el.innerHTML = ""; }, 3000);
  }

  // ---------------- delegación de eventos ----------------
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.dataset.action;
    switch (action) {
      case "open-room": openRoom(btn.dataset.id); break;
      case "open-container": openContainer(btn.dataset.id); break;
      case "open-drawer": openDrawer(btn.dataset.id); break;
      case "go-home": goHome(); break;
      case "go-back": goBack(); break;
      case "open-search": openSearchView(); break;
      case "open-map": openMapView(); break;
      case "goto-item": { var it = data.items.find(function (i) { return i.id === btn.dataset.id; }); if (it) goToItemLocation(it); break; }
      case "confirm-delete-room": openConfirm("room", btn.dataset.id); break;
      case "confirm-delete-container": openConfirm("container", btn.dataset.id); break;
      case "confirm-delete-drawer": openConfirm("drawer", btn.dataset.id); break;
      case "confirm-delete-execute": executeConfirmedDelete(); break;
      case "open-room-modal": openRoomModal(); break;
      case "open-container-modal": openContainerModal(); break;
      case "open-drawer-modal": openDrawerModal(); break;
      case "open-item-modal": openItemModalNew(btn.dataset.container, btn.dataset.drawer || null); break;
      case "edit-item": openItemModalEdit(btn.dataset.id); break;
      case "delete-item": deleteItem(btn.dataset.id); break;
      case "bump-qty": bumpQty(btn.dataset.id, parseInt(btn.dataset.delta, 10)); break;
      case "close-modal": closeModal(); viewingPhoto = null; break;
      case "pick-emoji": pickEmoji(btn.dataset.emoji); break;
      case "pick-color": pickColor(parseInt(btn.dataset.idx, 10)); break;
      case "save-room-modal": submitRoomModal(); break;
      case "save-container-modal": submitContainerModal(); break;
      case "save-drawer-modal": submitDrawerModal(); break;
      case "save-item-modal": submitItemModal(); break;
      case "photo-container": { var c = getContainer(btn.dataset.id); if (c && c.photo) openPhotoViewer("container", c.id, c.photo, c.name); else triggerPhotoUpload("container", btn.dataset.id); break; }
      case "photo-drawer": { var d = getDrawer(btn.dataset.id); if (d && d.photo) openPhotoViewer("drawer", d.id, d.photo, d.name); else triggerPhotoUpload("drawer", btn.dataset.id); break; }
      case "remove-photo": removeCurrentPhoto(); break;
      case "replace-photo": triggerReplacePhoto(); break;
      case "stop": break;
    }
  });

  document.getElementById("photoInput").addEventListener("change", handlePhotoSelected);

  // ---------------- arranque ----------------
  load();
  renderAll();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
